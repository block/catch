name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  swift:
    name: Swift build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [[ -z "$xcode_app" ]]; then
            echo "Xcode 26 is required for Swift tools 6.2 but was not found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $xcode_app"

      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
